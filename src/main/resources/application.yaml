ktor:
    application:
        modules:
            - be.vandeas.ApplicationKt.module
    deployment:
        port: 8082
hestia:
    upload:
        # Maximum size of a single multipart part, 1 GiB by default. Uploads are streamed through
        # `java.io.tmpdir`, which has to be able to hold a whole upload.
        maxSizeBytes: "$MAX_UPLOAD_SIZE_BYTES:1073741824"
